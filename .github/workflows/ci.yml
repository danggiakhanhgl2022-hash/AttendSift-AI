name: Source checks and Windows Local build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q main.py app.py cloud src tools
      - run: python -B -m pytest -q -p no:cacheprovider tests
      - run: python tools/release_audit.py .
      - run: python -B tools/privacy_audit.py .
      - run: python tools/check_release_encoding.py .
      - run: python -B tools/check_documentation.py
      - run: python -B tools/check_repository_layout.py
  windows-local:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Local installation diagnostics
        run: python tools/check_local_install.py
      - name: Require desktop dependency before regression tests
        run: python -c "import webview"
      - name: Local business and export regression tests
        run: python -B -m pytest -q -p no:cacheprovider tests
      - name: PyInstaller portable executable
        run: python -m PyInstaller --noconfirm --clean --distpath release --workpath build ChamCong.spec
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ChamCong-Windows-EXE
          path: release/ChamCong.exe
          if-no-files-found: error
